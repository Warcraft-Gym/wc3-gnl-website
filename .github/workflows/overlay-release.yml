name: Overlay release

on:
  push:
    tags:
      - "overlay-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/overlay/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build and publish release (tag push)
        if: startsWith(github.ref, 'refs/tags/overlay-v')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/overlay
          tagName: ${{ github.ref_name }}
          releaseName: "Warcraft 3 Gym Overlay ${{ github.ref_name }}"
          releaseBody: "See docs/overlay.md for install steps. Unsigned build — expect a SmartScreen prompt on Windows."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Publish portable Windows exe (tag push)
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/overlay-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}" -replace '^overlay-v', ''
          $dest = "Warcraft-3-Gym-Overlay_${version}_portable.exe"
          Copy-Item "apps/overlay/src-tauri/target/release/wc3gym-overlay.exe" $dest
          gh release upload "${{ github.ref_name }}" $dest --clobber

      - name: Build and upload workflow artifacts (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/overlay
          uploadWorkflowArtifacts: true
          args: ${{ matrix.args }}

      - name: Prepare portable Windows exe (manual run)
        if: matrix.platform == 'windows-latest' && github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: Copy-Item "apps/overlay/src-tauri/target/release/wc3gym-overlay.exe" "Warcraft-3-Gym-Overlay_portable.exe"

      - name: Upload portable Windows exe artifact (manual run)
        if: matrix.platform == 'windows-latest' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: portable-windows
          path: Warcraft-3-Gym-Overlay_portable.exe
